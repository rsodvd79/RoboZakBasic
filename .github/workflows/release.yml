name: Build Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Generate shared timestamp
        id: metadata
        run: echo "timestamp=$(date -u +'%Y.%m.%d.%H.%M')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            build-args: --no-bundle --ci
          - platform: macos
            runner: macos-latest
            build-args: --bundles app --ci
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
        working-directory: robozak

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: robozak/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Release
        run: npm run tauri build -- ${{ matrix.build-args }}

      - name: Create ZIP
        id: package
        env:
          TIMESTAMP: ${{ needs.metadata.outputs.timestamp }}
        run: |
          $name = "RoboZakBasic.${{ matrix.platform }}.$env:TIMESTAMP.zip"
          $archive = Join-Path $env:RUNNER_TEMP $name
          if ($IsWindows) {
            Compress-Archive -LiteralPath '.\src-tauri\target\release\robozak.exe' -DestinationPath $archive
          } else {
            $app = Join-Path $PWD 'src-tauri' 'target' 'release' 'bundle' 'macos' 'robozak.app'
            & ditto -c -k --sequesterRsrc --keepParent $app $archive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "name=$name" >> $env:GITHUB_OUTPUT
          "path=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RoboZakBasic-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: RoboZakBasic-*-${{ github.run_id }}
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TIMESTAMP: ${{ needs.metadata.outputs.timestamp }}
          TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          archives=(release/*.zip)
          if [[ ${#archives[@]} -ne 2 ]]; then
            echo "::error::Expected exactly two release ZIPs"
            exit 1
          fi
          for platform in windows macos; do
            test -s "release/RoboZakBasic.$platform.$TIMESTAMP.zip"
          done
          printf 'Branch: %s\nCommit: %s\nBuild (UTC): %s\n' \
            "$REF_NAME" "$GITHUB_SHA" "$TIMESTAMP" > release-notes.txt
          gh release create "$TAG" "${archives[@]}" \
            --target "$GITHUB_SHA" \
            --title "RoboZakBasic $TIMESTAMP ($REF_NAME)" \
            --notes-file release-notes.txt
